<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculatrice</title>
        
        <link rel="stylesheet" href="style.css">
          
    </head>
    <body>
        <header>
            <h1>Calculatrice</h1>
        </header>


        <main>
            <form id="calcForm">
                <label for="nombreA">Nombre A :</label>
                <input type="number" id="nombreA" name="nombreA" required>
                <br><br>
                <label for="nombreB">Nombre B :</label>
                <input type="number" id="nombreB" name="nombreB" required>
                <br><br>
                <label for="operation">Opération :</label>
                <select id="operation" name="operation">
                    <option value="+">Addition (+)</option>
                    <option value="-">Soustraction (-)</option>
                    <option value="*">Multiplication (×)</option>
                    <option value="/">Division (÷)</option>
                </select>
                <br><br>

                <button type="submit">Calculer</button>
            </form>

            <section id="messages" style="color:red; margin-top:15px;"></section>
            <section id="historique" style="margin-top:25px;">
                <h2>Historique des opérations</h2>
                <ul id="historiqueListe"></ul>
            </section>
        </main>

        <footer>
            <p>© 2025 - Mini Calculatrice</p>
        </footer>
        <script src="app.js"></script>
    </body>
</html>
